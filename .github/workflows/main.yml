name: Build Alune Native PS2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Alune
        uses: actions/checkout@v4

      - name: Checkout ARMSX2
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          path: armsx2
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Make iOS build script executable
        working-directory: armsx2
        run: |
          find platforms/ios -type f \
            \( -name "build-ios-ipa.sh" -o -name "*ipa*.sh" \) \
            -print

      - name: Build native iOS IPA
        working-directory: armsx2
        shell: bash
        run: |
          set -e

          SCRIPT=$(find platforms/ios -type f \
            -name "build-ios-ipa.sh" \
            -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "ARMSX2 iOS IPA build script was not found."
            echo "Listing iOS build files:"
            find platforms/ios -maxdepth 5 -type f | sort
            exit 1
          fi

          chmod +x "$SCRIPT"

          echo "Using:"
          echo "$SCRIPT"

          "$SCRIPT" --fast

      - name: Find IPA
        working-directory: armsx2
        run: |
          echo "Generated IPA files:"
          find . -type f -name "*.ipa" -print

      - name: Upload native IPA
        uses: actions/upload-artifact@v4
        with:
          name: Alune-native-iOS
          path: armsx2/**/*.ipa
          if-no-files-found: error
